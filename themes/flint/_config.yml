project-card:
  - title: BROKEN Universe
    image: image/broken.png
    description: 在这个神秘无限的宇宙中，每个人都有属于自己的故事。他们讲述着自己的成长经历，为了生活而战，为了自己的未来而战。
    url: https://broken.turboflint.cn
    status: 已推出
  - title: No Line Universe
    image: image/noline.jpg
    description: 一个专注于青春、艺术和文化的小说宇宙。在这个宇宙中，无论是谁，他们虽然有自己的故事，但又能互相相连起来。
    url: https://noline.turboflint.cn
    status: 已推出
  - title: Leaping Universe
    image: https://static.turboflint.cn/image/blog/leaping_900*383.png
    description: 以跃进机作为中心，探索未知的世界。
    status: 敬请期待

works:
  - title: 流浪虚无
    image: https://static.turboflint.cn/image/wandering-nothingness.png
    description: 破碎宇宙首部实验性概念小说，讲述了虚无之子和友人流浪宇宙，最终找到了心中的归属。
    category: BROKEN
    url: https://mp.weixin.qq.com/mp/appmsgalbum?__biz=Mzg2Njg5NTM1MA==&action=getalbum&album_id=3525729119851872258&scene=126#wechat_redirect
  - title: 第二者
    image: https://static.turboflint.cn/image/the_second_one_cover.png
    description: 背叛亦或者是逃离？一对伴侣新婚后，却有一方发现了秘密。最后，是毁灭，还是原谅？
    category: BROKEN
  - title: 杀手查莉
    image: https://static.turboflint.cn/image/killer_charlie.png
    description: 一名职业杀手，为了逃离家族的掌控，从而踏上了没有归途的逃亡之旅。
    category: BROKEN
  - title: 灿阳之下
    image: https://static.turboflint.cn/image/under_the_shining_sun.png
    description: 在灿阳之下，有着一个中二少年和一个体育生的小小世界。他们将讲述之间的小故事。
    category: NOLINE

