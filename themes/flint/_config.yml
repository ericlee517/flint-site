project-card:
  - title: BROKEN Universe
    image: image/broken.png
    description: 在这个神秘无限的宇宙中，每个人都有属于自己的故事。他们讲述着自己的成长经历，为了生活而战，为了自己的未来而战。
    url: https://broken.turboflint.cn
    status: 已推出
  - title: No Line Universe
    image: image/noline.jpg
    description: 一个专注于青春、艺术和文化的小说宇宙。在这个宇宙中，无论是谁，他们虽然有自己的故事，但又能互相相连起来。
    url: https://noline.turboflint.cn
    status: 已推出
  - title: Leaping Universe
    image: https://static.turboflint.cn/image/blog/leaping_900*383.png
    description: 以跃进机作为中心，探索未知的世界。
    status: 敬请期待

