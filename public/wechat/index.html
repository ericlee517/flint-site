<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关注微信公众号</title>
    <style>
        body {
            background-color: #333; /* 设置暗色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white; /* 设置文字颜色为白色，以便在暗色背景上可见 */
        }
        .qr-code-text {
            margin-bottom: 20px; /* 文字与二维码之间的间距 */
        }
        .qr-code {
            width: 200px; /* 可根据实际情况调整二维码宽度 */
            height: 200px; /* 可根据实际情况调整二维码高度 */
        }
        .copyright {
            margin-top: 20px; /* 版权信息与二维码之间的间距 */
            font-size: 12px; /* 版权信息字体大小 */
        }
    </style>
</head>
<body>
    <div class="qr-code-text"><h2>扫码关注微信公众号</h2></div>
    <img class="qr-code" src="../image/wechat_qrcode.jpg" alt="微信公众号二维码">
    <div class="copyright">&copy; Turbo Flint</div>
</body>
</html>
